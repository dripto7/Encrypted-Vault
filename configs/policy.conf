# KVault policy: which system users hold which role.
#
# Loaded by vaultctl at unseal time and pushed into the kernel with
# KVAULT_SET_ROLE. The file is advisory in one direction only: the kernel is
# the authority on what a role may do, this file only says who holds one.
#
# Format:  user <name|uid> <role>
# Roles:   admin | developer | auditor | guest
#
# Anyone not listed is a guest, which has no default permissions at all. That
# is the least-privilege default: forgetting to add someone denies them rather
# than silently granting access.

user root     admin
user kv_alice developer
user kv_bob   developer
user kv_carol auditor
user kv_eve   guest
