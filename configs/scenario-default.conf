# Default simulation scenario, read by kvsim.
#
# Three directives, and they belong in one file on purpose: the setup and the
# expectations have to stay in step with each other, and a scenario whose setup
# no longer matches its expectations silently stops testing anything.
#
#   secret <name> <value>                 seeded by the admin before the run
#   grant  <name> <subject> <perms>       subject: a role, or user:<name|uid>
#   step   <user> <op> <secret> <expect> [value]
#
# <op>     get | put | list | delete | rotate | audit
# <expect> allow | deny        - what the policy says SHOULD happen
# <perms>  any of r w d g
# '-'      an operand the operation does not take
#
# Roles come from policy.conf; this file says nothing about who holds one.

# --- what the vault starts with ---------------------------------------------
secret db_password  s3cr3t-db-pa55word
secret tls_key      tls-private-key-material

# --- who may reach what ------------------------------------------------------
# The developer ROLE may read db_password...
grant  db_password  developer      r
# ...while tls_key is granted to bob by IDENTITY. Alice and bob hold the same
# role, so the two grants together show that the role is not the decision.
grant  tls_key      user:kv_bob    r

# --- alice: a developer, read-only on one secret -----------------------------
step   kv_alice  get     db_password  allow
step   kv_alice  put     db_password  deny    overwritten
step   kv_alice  get     tls_key      deny
step   kv_alice  delete  db_password  deny
step   kv_alice  list    -            allow
# A developer may create a secret of her own, and owns what she creates.
step   kv_alice  put     alice_notes  allow   hers
step   kv_alice  get     alice_notes  allow

# --- bob: the same role, a different ACL -------------------------------------
step   kv_bob    get     tls_key      allow
step   kv_bob    get     db_password  allow
step   kv_bob    rotate  tls_key      deny

# --- eve: a guest, refused everything ----------------------------------------
step   kv_eve    get     db_password  deny
step   kv_eve    get     tls_key      deny
# Creating is refused too: without that check eve could squat a name an
# application expects to own.
step   kv_eve    put     backdoor     deny    mine
# LIST succeeds but returns nothing she may read.
step   kv_eve    list    -            allow

# --- carol: audits, and is refused the control device by file permissions ----
step   kv_carol  audit   -            allow
step   kv_carol  get     db_password  deny
