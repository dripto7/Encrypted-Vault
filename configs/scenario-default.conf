# Default simulation scenario.
#
# Each step names the principal, the operation and what the policy says should
# happen. The simulator compares the kernel's answer to the expectation, so a
# denial that was supposed to happen counts as a pass.
#
# Format: <user> <op> <secret> <expect:allow|deny>

# The admin seeds the vault and grants the developer role read access.
root      put     db_password   allow
root      grant   db_password   allow
root      put     tls_key       allow

# Alice is a developer: granted read, never write.
kv_alice  get     db_password   allow
kv_alice  put     db_password   deny
kv_alice  get     tls_key       deny

# Eve is a guest: denied everything, and LIST shows her nothing.
kv_eve    get     db_password   deny
kv_eve    list    -             allow

# Carol audits: she can follow the log but not read a secret.
kv_carol  audit   -             allow
kv_carol  get     db_password   deny
